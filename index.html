<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — TK Anggrek Hitam</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-mark">🌸</div>
      <h1>TK Anggrek Hitam</h1>
      <p class="sub">Masuk ke Dashboard Sekolah</p>

      <div id="loginError" class="login-error"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>
      </form>

      <p class="demo-note">
        Akses untuk Kepala Sekolah, Super Admin, dan Guru.<br>
        Hubungi Super Admin jika Anda belum memiliki akun.
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Jika sudah login, langsung ke dashboard
    if (getSession()) {
      window.location.href = "dashboard.html";
    }

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.textContent = "Memproses...";
      try {
        const result = await apiCall("login", { username, password });
        saveSession({
          token: result.token,
          username: result.username,
          nama: result.nama,
          role: result.role
        });
        window.location.href = "dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });
  </script>
</body>
</html>
