<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siswa — TK Anggrek Hitam</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><span class="logo-mark">🌸</span><span class="brand-text">TK Anggrek<br>Hitam</span></div>
    <nav class="menu">
      <a href="dashboard.html"><i data-lucide="layout-grid"></i><span class="label">Beranda</span></a>
      <a href="siswa.html" class="active"><i data-lucide="users"></i><span class="label">Siswa</span></a>
      <a href="guru.html"><i data-lucide="user"></i><span class="label">Guru</span></a>
      <a href="kegiatan.html"><i data-lucide="calendar-days"></i><span class="label">Kegiatan</span></a>
      <a href="pembayaran.html"><i data-lucide="credit-card"></i><span class="label">Pembayaran</span></a>
      <a href="laporan.html"><i data-lucide="file-text"></i><span class="label">Laporan</span></a>
      <a href="profil.html"><i data-lucide="building-2"></i><span class="label">Profil Sekolah</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" data-logout><i data-lucide="log-out"></i><span class="label">Keluar</span></button>
    </div>
  </aside>

  <header class="topbar">
    <div class="search-box"><i data-lucide="search"></i><input type="text" placeholder="Search..."></div>
    <div class="topbar-right">
      <div class="notif"><i data-lucide="bell"></i><span>Pemberitahuan</span></div>
      <div class="user-chip">
        <div class="avatar-circle" id="topbarAvatar">A</div>
        <div>
          <div id="topbarUserName">—</div>
          <div class="role-pill" id="topbarUserRole">—</div>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <h1 class="page-title">Data Siswa</h1>

    <div class="toolbar">
      <div class="search-box"><i data-lucide="search"></i><input type="text" id="searchSiswa" placeholder="Cari nama, NIS, atau kelompok..."></div>
      <button class="btn btn-primary" id="btnAddSiswa" data-roles="super_admin"><i data-lucide="plus"></i>Tambah Siswa</button>
    </div>

    <div class="panel panel-white">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>NIS</th><th>Nama</th><th>Kelompok</th><th>JK</th>
              <th>Nama Ayah</th><th>Nama Ibu</th><th>No. HP</th><th>Status</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="siswaTableBody">
            <tr><td colspan="9" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal Tambah/Edit Siswa -->
<div class="modal-overlay" id="siswaModal">
  <div class="modal modal-wide">
    <h3 id="siswaModalTitle">Tambah Siswa</h3>
    <form id="siswaForm">
      <input type="hidden" id="siswa_id">
      <div id="siswaFormFields"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelSiswa">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Detail Siswa (read-only) -->
<div class="modal-overlay" id="detailModal">
  <div class="modal modal-wide">
    <h3 id="detailModalTitle">Detail Siswa</h3>
    <div id="detailContent"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnCloseDetail">Tutup</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/siswa-fields.js"></script>
<script>
  const session = requireAuth();
  let allSiswa = [];
  const canEdit = session && session.role === "super_admin";

  if (session) {
    initLayout(session);
    buildForm();
    loadSiswa();
    document.getElementById("btnAddSiswa").addEventListener("click", () => openModal());
    document.getElementById("btnCancelSiswa").addEventListener("click", closeModal);
    document.getElementById("siswaForm").addEventListener("submit", saveSiswa);
    document.getElementById("btnCloseDetail").addEventListener("click", closeDetail);
    document.getElementById("searchSiswa").addEventListener("input", (e) => renderTable(e.target.value));
  }

  function buildForm() {
    const container = document.getElementById("siswaFormFields");
    container.innerHTML = SISWA_FIELDS.map((section) => {
      const fieldsHtml = section.fields.map((f) => {
        const id = "siswa_" + f.key;
        let inputHtml;
        if (f.type === "select") {
          inputHtml = `<select id="${id}"${f.required ? " required" : ""}>` +
            (f.required ? "" : '<option value="">-</option>') +
            f.options.map((o) => `<option value="${o}">${o}</option>`).join("") +
            `</select>`;
        } else {
          inputHtml = `<input type="${f.type}" id="${id}"` +
            (f.placeholder ? ` placeholder="${f.placeholder}"` : "") +
            (f.required ? " required" : "") + `>`;
        }
        return `<div class="field"><label>${f.label}</label>${inputHtml}</div>`;
      }).join("");
      return `<div class="form-section"><h4>${section.section}</h4><div class="form-grid">${fieldsHtml}</div></div>`;
    }).join("");
  }

  async function loadSiswa() {
    try {
      allSiswa = await apiCall("getSiswaList");
      renderTable("");
    } catch (err) {
      document.getElementById("siswaTableBody").innerHTML =
        `<tr><td colspan="9" class="empty-state">Gagal memuat data: ${err.message}</td></tr>`;
    }
  }

  function renderTable(filter) {
    const q = (filter || "").trim().toLowerCase();
    const rows = allSiswa.filter((s) =>
      !q || (s.nama || "").toLowerCase().includes(q) || (s.nis || "").toLowerCase().includes(q) || (s.kelas || "").toLowerCase().includes(q)
    );
    const body = document.getElementById("siswaTableBody");
    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="9" class="empty-state">Tidak ada data siswa.</td></tr>';
      return;
    }
    body.innerHTML = rows.map((s) => `
      <tr>
        <td>${s.nis || "-"}</td>
        <td>${s.nama}</td>
        <td>${s.kelas || "-"}</td>
        <td>${(s.jenisKelamin || "-").charAt(0)}</td>
        <td>${s.namaAyah || "-"}</td>
        <td>${s.namaIbu || "-"}</td>
        <td>${s.hpAyah || s.hpIbu || "-"}</td>
        <td><span class="badge ${s.status === "Aktif" ? "badge-aktif" : "badge-nonaktif"}">${s.status}</span></td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" onclick='openDetail(${JSON.stringify(s)})' title="Detail"><i data-lucide="eye" style="width:16px;"></i></button>
            <button class="icon-btn" data-roles="super_admin" onclick='openModal(${JSON.stringify(s)})' title="Edit"><i data-lucide="pencil" style="width:16px;"></i></button>
            <button class="icon-btn" data-roles="super_admin" onclick="deleteSiswa('${s.id}')" title="Hapus"><i data-lucide="trash-2" style="width:16px;"></i></button>
          </div>
        </td>
      </tr>
    `).join("");
    document.querySelectorAll("[data-roles]").forEach((el) => {
      const allowed = el.getAttribute("data-roles").split(",");
      el.style.display = allowed.indexOf(session.role) === -1 ? "none" : "";
    });
    lucide.createIcons();
  }

  function openModal(s) {
    if (!canEdit) return;
    document.getElementById("siswaModalTitle").textContent = s ? "Edit Siswa" : "Tambah Siswa";
    document.getElementById("siswa_id").value = s ? s.id : "";
    ALL_SISWA_FIELDS.forEach((f) => {
      const el = document.getElementById("siswa_" + f.key);
      if (el) el.value = s ? (s[f.key] || "") : "";
    });
    document.getElementById("siswaModal").classList.add("open");
  }
  function closeModal() {
    document.getElementById("siswaModal").classList.remove("open");
  }

  function openDetail(s) {
    document.getElementById("detailModalTitle").textContent = "Detail Siswa — " + s.nama;
    document.getElementById("detailContent").innerHTML = SISWA_FIELDS.map((section) => {
      const rows = section.fields
        .filter((f) => s[f.key])
        .map((f) => `<div class="detail-row"><span class="detail-label">${f.label}</span><span class="detail-value">${s[f.key]}</span></div>`)
        .join("");
      if (!rows) return "";
      return `<div class="detail-section"><h4>${section.section}</h4>${rows}</div>`;
    }).join("");
    document.getElementById("detailModal").classList.add("open");
  }
  function closeDetail() {
    document.getElementById("detailModal").classList.remove("open");
  }

  async function saveSiswa(e) {
    e.preventDefault();
    const id = document.getElementById("siswa_id").value;
    const payload = { id: id || undefined };
    ALL_SISWA_FIELDS.forEach((f) => {
      const el = document.getElementById("siswa_" + f.key);
      payload[f.key] = el ? el.value.trim() : "";
    });
    try {
      await apiCall(id ? "updateSiswa" : "addSiswa", payload);
      closeModal();
      loadSiswa();
    } catch (err) {
      alert("Gagal menyimpan: " + err.message);
    }
  }

  async function deleteSiswa(id) {
    if (!canEdit) return;
    if (!confirm("Hapus data siswa ini?")) return;
    try {
      await apiCall("deleteSiswa", { id });
      loadSiswa();
    } catch (err) {
      alert("Gagal menghapus: " + err.message);
    }
  }
</script>
</body>
</html>
