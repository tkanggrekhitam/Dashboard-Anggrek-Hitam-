<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siswa — TK Anggrek Hitam</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><span class="logo-mark">🌸</span><span class="brand-text">TK Anggrek<br>Hitam</span></div>
    <nav class="menu">
      <a href="dashboard.html"><i data-lucide="layout-grid"></i><span class="label">Beranda</span></a>
      <a href="siswa.html" class="active"><i data-lucide="users"></i><span class="label">Siswa</span></a>
      <a href="guru.html"><i data-lucide="user"></i><span class="label">Guru</span></a>
      <a href="#" onclick="return false;" style="opacity:.5;"><i data-lucide="settings"></i><span class="label">Kegiatan</span></a>
      <a href="#" onclick="return false;" style="opacity:.5;"><i data-lucide="credit-card"></i><span class="label">Pembayaran</span></a>
      <a href="#" onclick="return false;" style="opacity:.5;"><i data-lucide="file-text"></i><span class="label">Laporan</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" data-logout><i data-lucide="log-out"></i><span class="label">Keluar</span></button>
    </div>
  </aside>

  <header class="topbar">
    <div class="search-box"><i data-lucide="search"></i><input type="text" placeholder="Search..."></div>
    <div class="topbar-right">
      <div class="notif"><i data-lucide="bell"></i><span>Pemberitahuan</span></div>
      <div class="user-chip">
        <div class="avatar-circle" id="topbarAvatar">A</div>
        <div>
          <div id="topbarUserName">—</div>
          <div class="role-pill" id="topbarUserRole">—</div>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <h1 class="page-title">Data Siswa</h1>

    <div class="toolbar">
      <div class="search-box"><i data-lucide="search"></i><input type="text" id="searchSiswa" placeholder="Cari nama siswa atau kelas..."></div>
      <button class="btn btn-primary" id="btnAddSiswa" data-roles="super_admin"><i data-lucide="plus"></i>Tambah Siswa</button>
    </div>

    <div class="panel panel-white">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Nama</th><th>Jenis Kelamin</th><th>Kelas</th><th>Nama Orang Tua</th>
              <th>Tahun Ajaran</th><th>Status</th><th data-roles="super_admin">Aksi</th>
            </tr>
          </thead>
          <tbody id="siswaTableBody">
            <tr><td colspan="7" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal Tambah/Edit Siswa -->
<div class="modal-overlay" id="siswaModal">
  <div class="modal">
    <h3 id="siswaModalTitle">Tambah Siswa</h3>
    <form id="siswaForm">
      <input type="hidden" id="siswaId">
      <div class="field"><label>Nama Lengkap</label><input type="text" id="siswaNama" required></div>
      <div class="field"><label>Jenis Kelamin</label>
        <select id="siswaJK" required><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select>
      </div>
      <div class="field"><label>Tanggal Lahir</label><input type="date" id="siswaTglLahir"></div>
      <div class="field"><label>Nama Orang Tua / Wali</label><input type="text" id="siswaOrtu"></div>
      <div class="field"><label>Kelas</label><input type="text" id="siswaKelas" placeholder="Kelas A1, A2, B1..." required></div>
      <div class="field"><label>Tahun Ajaran</label><input type="text" id="siswaTahunAjaran" placeholder="2025-2026" required></div>
      <div class="field"><label>Status</label>
        <select id="siswaStatus"><option value="Aktif">Aktif</option><option value="Nonaktif">Nonaktif</option></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelSiswa">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  const session = requireAuth();
  let allSiswa = [];
  const canEdit = session && session.role === "super_admin";

  if (session) {
    initLayout(session);
    loadSiswa();
    document.getElementById("btnAddSiswa").addEventListener("click", () => openModal());
    document.getElementById("btnCancelSiswa").addEventListener("click", closeModal);
    document.getElementById("siswaForm").addEventListener("submit", saveSiswa);
    document.getElementById("searchSiswa").addEventListener("input", (e) => renderTable(e.target.value));
  }

  async function loadSiswa() {
    try {
      allSiswa = await apiCall("getSiswaList");
      renderTable("");
    } catch (err) {
      document.getElementById("siswaTableBody").innerHTML =
        `<tr><td colspan="7" class="empty-state">Gagal memuat data: ${err.message}</td></tr>`;
    }
  }

  function renderTable(filter) {
    const q = filter.trim().toLowerCase();
    const rows = allSiswa.filter((s) =>
      !q || s.nama.toLowerCase().includes(q) || (s.kelas || "").toLowerCase().includes(q)
    );
    const body = document.getElementById("siswaTableBody");
    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="7" class="empty-state">Tidak ada data siswa.</td></tr>';
      return;
    }
    body.innerHTML = rows.map((s) => `
      <tr>
        <td>${s.nama}</td>
        <td>${s.jenisKelamin || "-"}</td>
        <td>${s.kelas || "-"}</td>
        <td>${s.namaOrtu || "-"}</td>
        <td>${s.tahunAjaran || "-"}</td>
        <td><span class="badge ${s.status === "Aktif" ? "badge-aktif" : "badge-nonaktif"}">${s.status}</span></td>
        <td data-roles="super_admin">
          <div class="row-actions">
            <button class="icon-btn" onclick='openModal(${JSON.stringify(s)})'><i data-lucide="pencil" style="width:16px;"></i></button>
            <button class="icon-btn" onclick="deleteSiswa('${s.id}')"><i data-lucide="trash-2" style="width:16px;"></i></button>
          </div>
        </td>
      </tr>
    `).join("");
    document.querySelectorAll("[data-roles]").forEach((el) => {
      const allowed = el.getAttribute("data-roles").split(",");
      el.style.display = allowed.indexOf(session.role) === -1 ? "none" : "";
    });
    lucide.createIcons();
  }

  function openModal(s) {
    if (!canEdit) return;
    document.getElementById("siswaModalTitle").textContent = s ? "Edit Siswa" : "Tambah Siswa";
    document.getElementById("siswaId").value = s ? s.id : "";
    document.getElementById("siswaNama").value = s ? s.nama : "";
    document.getElementById("siswaJK").value = s ? s.jenisKelamin : "Laki-laki";
    document.getElementById("siswaTglLahir").value = s ? s.tanggalLahir : "";
    document.getElementById("siswaOrtu").value = s ? s.namaOrtu : "";
    document.getElementById("siswaKelas").value = s ? s.kelas : "";
    document.getElementById("siswaTahunAjaran").value = s ? s.tahunAjaran : "";
    document.getElementById("siswaStatus").value = s ? s.status : "Aktif";
    document.getElementById("siswaModal").classList.add("open");
  }
  function closeModal() {
    document.getElementById("siswaModal").classList.remove("open");
  }

  async function saveSiswa(e) {
    e.preventDefault();
    const id = document.getElementById("siswaId").value;
    const payload = {
      id: id || undefined,
      nama: document.getElementById("siswaNama").value.trim(),
      jenisKelamin: document.getElementById("siswaJK").value,
      tanggalLahir: document.getElementById("siswaTglLahir").value,
      namaOrtu: document.getElementById("siswaOrtu").value.trim(),
      kelas: document.getElementById("siswaKelas").value.trim(),
      tahunAjaran: document.getElementById("siswaTahunAjaran").value.trim(),
      status: document.getElementById("siswaStatus").value
    };
    try {
      await apiCall(id ? "updateSiswa" : "addSiswa", payload);
      closeModal();
      loadSiswa();
    } catch (err) {
      alert("Gagal menyimpan: " + err.message);
    }
  }

  async function deleteSiswa(id) {
    if (!canEdit) return;
    if (!confirm("Hapus data siswa ini?")) return;
    try {
      await apiCall("deleteSiswa", { id });
      loadSiswa();
    } catch (err) {
      alert("Gagal menghapus: " + err.message);
    }
  }
</script>
</body>
</html>
